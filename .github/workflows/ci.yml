name: server-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SummerAPIServer.slnx
      - run: dotnet tool restore
      - run: dotnet build SummerAPIServer.slnx --configuration Release --no-restore --nologo
      - run: dotnet test SummerAPIServer.slnx --configuration Release --no-build --nologo
      - run: dotnet ef migrations has-pending-model-changes --project SummerLoginServer --startup-project SummerLoginServer --configuration Release --no-build
      - run: dotnet ef migrations has-pending-model-changes --project SummerGameServer --startup-project SummerGameServer --configuration Release --no-build
